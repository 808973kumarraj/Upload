<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uploaded Text</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <pre id="content">Loading text...</pre>
  <script>
    fetch('https://raw.githubusercontent.com/808973kumarraj/Upload/main/context.txt')
      .then(response => {
        if (!response.ok) throw new Error('Cannot load text');
        return response.text();
      })
      .then(text => {
        document.getElementById('content').textContent = text;
      })
      .catch(error => {
        document.getElementById('content').textContent =
          'Unable to load the text. Please refresh the page.';
      });
  </script>
</body>
</html>
