<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uploaded Text</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 20px auto;
      padding: 16px;
      line-height: 1.6;
      background: #f5f5f5;
      color: #222;
    }
    h1 {
      overflow-wrap: anywhere;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Uploaded Text</h1>
  <pre id="content">Loading text...</pre>

  <script>
    fetch('./context.txt')
      .then(response => {
        if (!response.ok) {
          throw new Error('Unable to load text file');
        }
        return response.text();
      })
      .then(text => {
        document.getElementById('content').textContent = text;
      })
      .catch(() => {
        document.getElementById('content').textContent =
          'Text file not found. Check that context.txt is in the repository root.';
      });
  </script>
</body>
</html>
