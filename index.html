<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="description" content="Interactive visual simulator and engineering workstation for the Apache Spark Catalyst query optimizer, physical planner, and whole-stage code generation engine."/>
<title>Spark Catalyst Optimizer Simulator</title>
<style>
/* ============ BASE / TOKENS ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --s950:#020617;--s900:#0f172a;--s800:#1e293b;--s700:#334155;--s600:#475569;--s500:#64748b;--s400:#94a3b8;--s300:#cbd5e1;--s200:#e2e8f0;--s100:#f1f5f9;
 --cy3:#67e8f9;--cy4:#22d3ee;--cy5:#06b6d4;--cy6:#0891b2;--cy8:#155e75;--cy9:#164e63;--cy95:#083344;
 --am3:#fcd34d;--am4:#fbbf24;--am5:#f59e0b;--am6:#d97706;--am9:#78350f;--am95:#451a03;
 --em3:#6ee7b7;--em4:#34d399;--em7:#047857;--em8:#065f46;--em95:#022c22;
 --ro3:#fda4af;--ro4:#fb7185;--ro5:#f43f5e;--ro8:#9f1239;--ro95:#4c0519;
 --in3:#a5b4fc;--in4:#818cf8;--in7:#4338ca;--in8:#3730a3;--in95:#1e1b4b;
 --bl4:#60a5fa;--bl7:#1d4ed8;--bl95:#172554;
 --pu3:#d8b4fe;--pu4:#c084fc;--pu7:#7e22ce;--pu95:#3b0764;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--s950);color:var(--s100);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
::selection{background:var(--cy9);color:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s25{width:10px;height:10px}.s3{width:12px;height:12px}.s35{width:14px;height:14px}.s4{width:16px;height:16px}.s45{width:18px;height:18px}
.hide-sm{display:none}.hide-md{display:none}.hide-lg{display:none}
@media(min-width:640px){.hide-sm{display:inline-flex}}
@media(min-width:768px){.hide-md{display:inline-flex}}
@media(min-width:1024px){.hide-lg{display:flex}}
/* ============ HEADER ============ */
#hdr{background:var(--s950);border-bottom:1px solid var(--s800);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;color:var(--s200)}
.hdr-left{display:flex;align-items:center;gap:12px}
.brand-ic{width:32px;height:32px;border-radius:6px;background:linear-gradient(to top right,#0891b2,#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 0 8px rgba(0,0,0,.35)}
.brand-t{display:flex;align-items:center;gap:6px}
.brand-t b{font-weight:700;letter-spacing:-.02em;color:#fff;font-size:13px}
@media(min-width:640px){.brand-t b{font-size:15px}}
.sim-badge{font-size:10px;font-family:ui-monospace,monospace;padding:1px 6px;background:var(--in95);border:1px solid var(--in8);color:var(--in3);border-radius:4px}
.engine-row{font-size:11px;color:var(--s400);display:flex;align-items:center;gap:4px}
.dd-wrap{position:relative;display:inline-block}
.dd-btn{font-weight:500;color:var(--cy3);text-decoration:underline;text-decoration-style:dotted;display:inline-flex;align-items:center;gap:2px;font-size:13px}
.dd-panel{position:absolute;left:0;top:calc(100% + 4px);width:288px;background:var(--s900);border:1px solid var(--s700);border-radius:6px;box-shadow:0 20px 25px -5px rgba(0,0,0,.5);padding:4px 0;z-index:50}
.dd-panel.wide{width:320px}
.dd-cap{padding:4px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--s400);font-family:ui-monospace,monospace;border-bottom:1px solid var(--s800)}
.dd-item{width:100%;text-align:left;padding:8px 12px;font-size:12px;display:flex;flex-direction:column;gap:1px;color:var(--s300)}
.dd-item:hover{background:var(--s800)}
.dd-item.act{background:rgba(30,41,59,.8);color:var(--cy3);font-weight:600}
.dd-item .sub{font-size:10px;color:var(--s400)}
.dd-item .sub2{font-size:11px;color:var(--s400);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dd-item.act .sub2{color:var(--am3)}
.preset-btn{padding:4px 10px;background:var(--s900);border:1px solid var(--s700);border-radius:4px;font-size:12px;color:var(--s300);display:inline-flex;align-items:center;gap:6px;max-width:220px}
.preset-btn span{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.st-err{background:rgba(76,5,25,.8);color:var(--ro3);border:1px solid var(--ro8)}
.st-run{background:rgba(8,51,68,.8);color:var(--cy3);border:1px solid var(--cy8)}
.st-done{background:rgba(2,44,34,.8);color:var(--em3);border:1px solid var(--em8)}
.st-cust{background:rgba(69,26,3,.8);color:var(--am3);border:1px solid #92400e}
.st-def{background:var(--s800);color:var(--s300);border:1px solid var(--s700)}
.step-ctr{background:var(--s900);border:1px solid var(--s800);padding:4px 10px;border-radius:4px;font-family:ui-monospace,monospace;font-size:12px;display:flex;align-items:center;gap:4px;color:var(--s300)}
.step-ctr .a{color:var(--s500)}.step-ctr .b{font-weight:700;color:var(--cy4)}.step-ctr .c{color:var(--s600)}.step-ctr .d{color:var(--s400)}
.view-sw{background:var(--s900);padding:2px;border-radius:4px;border:1px solid var(--s800);font-size:12px;display:none}
@media(min-width:640px){.view-sw{display:flex}}
.vsw-btn{padding:4px 10px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;color:var(--s400);transition:color .15s}
.vsw-btn:hover{color:var(--s200)}
.vsw-btn.act{background:var(--s800);color:#fff;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.hdr-btn{padding:4px 10px;background:var(--s900);border:1px solid var(--s700);color:var(--s300);border-radius:4px;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:color .15s,background .15s}
.hdr-btn:hover{background:var(--s800);color:#fff}
.guide-btn{background:rgba(30,27,75,.6);border:1px solid var(--in7);color:#c7d2fe}
.guide-btn:hover{background:rgba(30,27,75,.8)}
/* ============ CONTROL DECK ============ */
#deck{background:var(--s900);border-bottom:1px solid var(--s800);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;font-size:14px;user-select:none;-webkit-user-select:none}
.dk-group{display:flex;align-items:center;gap:6px}
.ctl-btn{padding:6px 10px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;font-weight:500;transition:all .15s;color:var(--s200);background:var(--s800)}
.ctl-btn:hover{background:var(--s700)}
.ctl-btn:active{transform:scale(.95)}
.ctl-btn.dis{color:var(--s600);background:rgba(30,41,59,.4);cursor:not-allowed}
.ctl-btn.dis:active{transform:none}
.play-btn{padding:6px 12px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#fff;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.play-btn.go{background:#059669}.play-btn.go:hover{background:#10b981}
.play-btn.stop{background:var(--am6)}.play-btn.stop:hover{background:var(--am5)}
.play-btn:active{transform:scale(.95)}
.ctl-ico{padding:6px;border-radius:4px;color:var(--s300);background:rgba(30,41,59,.6)}
.ctl-ico:hover{background:var(--s800);color:#fff}
.ctl-def{padding:4px 10px;font-size:12px;border-radius:4px;border:1px solid var(--s700);color:var(--am3);display:inline-flex;align-items:center;gap:4px}
.ctl-def:hover{background:rgba(69,26,3,.4)}
.vdiv{width:1px;height:16px;background:var(--s800);margin:0 4px}
.ev-banner{display:none;align-items:center;gap:8px;background:rgba(2,6,23,.7);border:1px solid rgba(30,41,59,.8);padding:4px 12px;border-radius:4px;max-width:448px;overflow:hidden}
.ev-banner .l{font-size:12px;text-transform:uppercase;font-family:ui-monospace,monospace;color:var(--cy4);display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.ev-banner .v{font-size:12px;color:var(--s300);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:1024px){.ev-banner{display:flex}}
.spd-wrap{display:flex;align-items:center;background:rgba(30,41,59,.8);border-radius:4px;padding:2px;border:1px solid rgba(51,65,85,.6);font-size:12px}
.spd-btn{padding:2px 8px;border-radius:4px;font-family:ui-monospace,monospace;color:var(--s400);transition:color .15s}
.spd-btn:hover{color:var(--s200)}
.spd-btn.act{background:var(--cy6);color:#fff;font-weight:700}
.tgl-btn{padding:4px 10px;border-radius:4px;border:1px solid;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.tgl-btn.on{background:var(--cy95);border-color:var(--cy8);color:var(--cy3)}
.tgl-btn.off{background:var(--s800);border-color:var(--s700);color:var(--s300)}
/* ============ WORKBENCH ============ */
#wb{background:var(--s950);border-bottom:1px solid var(--s800)}
.wb-grid{display:grid;grid-template-columns:1fr}
@media(min-width:1024px){.wb-grid.split{grid-template-columns:1fr 1fr}.wb-grid.split .wb-panel+.wb-panel{border-left:1px solid var(--s800)}}
.wb-panel{display:flex;flex-direction:column;height:280px;background:var(--s950)}
.wb-tb{background:rgba(15,23,42,.9);padding:6px 12px;border-bottom:1px solid var(--s800);display:flex;align-items:center;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:6px}
.wb-tl{display:flex;align-items:center;gap:6px;color:var(--s300);font-family:ui-monospace,monospace}
.wb-tl b{font-weight:600;color:var(--s200)}
.tag{font-size:10px;padding:1px 4px;border-radius:4px;border:1px solid var(--s700);color:var(--s400);background:var(--s800)}
.tag.am{background:rgba(69,26,3,.8);color:var(--am3);border-color:#92400e}
.tb-btn{padding:2px 8px;background:var(--s800);color:var(--cy3);border:1px solid var(--s700);border-radius:4px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.tb-btn:hover{background:var(--s700);color:#a5f3fc}
.ico-btn{padding:4px;border-radius:4px;color:var(--s400)}
.ico-btn:hover{background:var(--s800);color:var(--s200)}
.wb-code{flex:1;overflow:auto;padding:8px;font-family:ui-monospace,monospace;font-size:12px;color:var(--s300);line-height:1.6;-webkit-overflow-scrolling:touch}
.wb-code table{width:100%;border-collapse:collapse}
.wb-code td{padding:1px 0;vertical-align:top}
.lno{width:32px;text-align:right;padding-right:12px!important;color:var(--s600);font-size:11px;user-select:none;-webkit-user-select:none}
.ltxt{white-space:pre-wrap;word-break:break-word}
tr.ln-act{background:rgba(8,51,68,.6);box-shadow:inset 2px 0 0 var(--cy4)}
tr.ln-act .ltxt{color:#cffafe;font-weight:600}
tr:not(.ln-act):hover{background:rgba(15,23,42,.4)}
.k-cyan{color:var(--cy3);font-weight:500}.k-indigo{color:var(--in3)}.k-plain{color:var(--s200)}.k-cmt{color:var(--s500);font-style:italic}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cy4);margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:1}80%,100%{transform:scale(2.2);opacity:0}}
.ping{animation:ping 1.2s cubic-bezier(0,0,.2,1) infinite}
.exec-btn{padding:4px 12px;background:linear-gradient(to right,var(--am6),var(--am5));color:var(--s950);font-weight:700;border-radius:4px;font-size:12px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 6px -1px rgba(0,0,0,.3);transition:all .15s}
.exec-btn:active{transform:scale(.95)}
.exec-btn.dis{opacity:.5;cursor:not-allowed}
.err-bar{background:rgba(76,5,25,.7);border-bottom:1px solid rgba(159,18,57,.8);padding:4px 12px;font-size:12px;color:var(--ro3);display:flex;align-items:center;gap:6px}
.ed-wrap{flex:1;position:relative;display:flex;overflow:hidden}
.gutter{width:36px;background:rgba(15,23,42,.6);border-right:1px solid rgba(30,41,59,.6);padding:8px;text-align:right;user-select:none;-webkit-user-select:none;font-family:ui-monospace,monospace;font-size:12px;color:var(--s600);line-height:1.6;overflow:hidden}
#ed-ta{flex:1;padding:8px;background:transparent;border:none;resize:none;outline:none;font-family:ui-monospace,monospace;font-size:12px;color:var(--s200);line-height:1.6;overflow:auto;-webkit-overflow-scrolling:touch}
/* ============ MAIN LAYOUT ============ */
#main{flex:1;padding:12px;max-width:1720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
@media(min-width:640px){#main{padding:16px}}
.row-a{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1024px){.row-a{grid-template-columns:repeat(12,1fr)}.viz-col{grid-column:span 12}.viz-col.wp{grid-column:span 8}.pr-col{grid-column:span 4}}
@media(min-width:1280px){.viz-col.wp{grid-column:span 9}.pr-col{grid-column:span 3}}
.card{background:var(--s900);border:1px solid var(--s800);border-radius:8px;color:var(--s200)}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--s800);font-size:12px;flex-wrap:wrap;gap:8px}
.card-t{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--s300)}
/* ============ CATALYST VISUALIZER ============ */
.viz{background:rgba(15,23,42,.9);border:1px solid var(--s800);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:520px}
.viz-top{background:var(--s950);padding:8px 12px;border-bottom:1px solid var(--s800);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.viz-lab{display:flex;align-items:center;gap:6px;font-size:12px;font-family:ui-monospace,monospace}
.viz-lab b{font-weight:600;color:var(--s200)}
.ph-row{display:flex;align-items:center;gap:4px;font-size:11px;font-family:ui-monospace,monospace;overflow-x:auto;padding:2px 0;max-width:100%}
.ph-pill{display:flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;border:1px solid;transition:all .2s;white-space:nowrap}
.ph-cur{background:var(--cy95);border-color:var(--cy5);color:var(--cy3);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.3),0 0 12px rgba(8,51,68,.3)}
.ph-done{background:rgba(30,41,59,.8);border-color:var(--s700);color:var(--s300)}
.ph-todo{background:rgba(15,23,42,.4);border-color:var(--s800);color:var(--s500)}
.tab-row{display:flex;align-items:center;gap:4px;background:var(--s900);padding:2px;border-radius:4px;border:1px solid var(--s800);font-size:12px;flex-wrap:wrap}
.tab-btn{padding:4px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;color:var(--s400);transition:color .15s}
.tab-btn:hover{color:var(--s200)}
.tab-btn.act{background:var(--s800);color:var(--cy3);font-weight:500}
.viz-body{flex:1;display:flex;overflow:hidden}
.viz-canvas{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.tree-col{display:flex;flex-direction:column;align-items:center}
.node-box{padding:8px 12px;border-radius:4px;border:1px solid;cursor:pointer;transition:all .2s;max-width:288px;width:auto;text-align:center;position:relative}
.node-box:hover{filter:brightness(1.1);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.node-box.sel{box-shadow:0 0 0 2px var(--cy4),0 10px 15px -3px rgba(2,6,23,.8)}
.nb-blue{border-color:var(--bl7);background:rgba(23,37,84,.4);color:#bfdbfe}
.nb-em{border-color:var(--em7);background:rgba(2,44,34,.4);color:#a7f3d0}
.nb-in{border-color:var(--in7);background:rgba(30,27,75,.4);color:#c7d2fe}
.nb-pu{border-color:var(--pu7);background:rgba(59,7,100,.4);color:#e9d5ff}
.nb-ro{border-color:#be123c;background:rgba(76,5,19,.4);color:#fecdd3}
.nb-cy{border-color:var(--cy6);background:rgba(8,51,68,.4);color:#a5f3fc}
.nb-sl{border-color:var(--s700);background:var(--s900);color:var(--s200)}
.node-t{font-size:12px;font-weight:700;font-family:ui-monospace,monospace;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:4px}
.node-d{font-size:10px;color:var(--s400);font-family:ui-monospace,monospace;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.tbadge{position:absolute;top:-8px;right:-8px;font-size:9px;font-family:ui-monospace,monospace;padding:1px 6px;border-radius:999px;background:var(--cy6);color:#fff;font-weight:700;letter-spacing:.05em;box-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap}
.cn-down{width:1px;height:16px;background:var(--s700)}
.ch-row{display:flex;align-items:flex-start;gap:16px;position:relative}
.ch-row .tree-col::before{content:"";display:block;width:1px;height:12px;background:var(--s700)}
.hline{position:absolute;top:0;left:15%;right:15%;height:1px;background:var(--s700)}
.drawer{width:288px;background:var(--s950);border-left:1px solid var(--s800);padding:12px;overflow:auto;flex-shrink:0;display:flex;flex-direction:column;font-size:12px}
@media(max-width:767px){.drawer{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 20px rgba(0,0,0,.5)}}
.dr-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--s800)}
.dr-lab{font-size:10px;text-transform:uppercase;font-family:ui-monospace,monospace;color:var(--s500)}
.dr-val{color:var(--s300);font-weight:500;margin:2px 0 8px}
.dr-mono{color:var(--s400);font-size:11px;font-family:ui-monospace,monospace;margin-top:2px;word-break:break-word;background:rgba(15,23,42,.6);padding:6px;border-radius:4px;border:1px solid rgba(30,41,59,.8)}
.fchip{font-size:11px;font-family:ui-monospace,monospace;color:var(--em3);background:rgba(2,44,34,.4);border:1px solid rgba(6,95,70,.6);padding:1px 6px;border-radius:4px;display:block;margin-top:4px}
.sch-tbl{width:100%;font-size:10px;font-family:ui-monospace,monospace;border-collapse:collapse}
.sch-tbl td{padding:3px;border-bottom:1px solid rgba(30,41,59,.6)}
.sch-tbl tr:last-child td{border-bottom:none}
.sch-n{color:var(--s300)}.sch-t{color:var(--in3);text-align:right}
.dr-call{padding:8px;border-radius:4px;background:rgba(8,51,68,.4);border:1px solid rgba(21,94,117,.6);font-size:11px;color:#a5f3fc;margin-top:8px}
.stage-card{background:var(--s950);border:1px solid var(--s800);border-radius:4px;padding:12px;font-size:12px;font-family:ui-monospace,monospace;margin-bottom:12px}
.st-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--s800);margin-bottom:8px;flex-wrap:wrap;gap:6px}
.st-name{font-weight:700;color:var(--cy3)}
.st-badge{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid}
.st-shuf{background:var(--ro95);color:var(--ro3);border-color:var(--ro8)}
.st-pipe{background:var(--em95);color:var(--em3);border-color:var(--em8)}
.op-chip{padding:1px 6px;border-radius:4px;background:var(--s900);color:var(--s300);border:1px solid var(--s800);font-size:10px;display:inline-block;margin:2px 4px 2px 0}
.code-hd{background:var(--s950);padding:8px;border-bottom:1px solid var(--s800);font-size:12px;font-family:ui-monospace,monospace;color:var(--cy3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.code-pre{flex:1;overflow:auto;padding:12px;font-family:ui-monospace,monospace;font-size:12px;color:var(--s300);background:rgba(2,6,23,.8);line-height:1.6;white-space:pre;-webkit-overflow-scrolling:touch}
.rule-item{background:var(--s950);padding:10px;border-radius:4px;border:1px solid var(--s800);font-size:12px;font-family:ui-monospace,monospace;margin-bottom:8px}
.empty-note{text-align:center;padding:48px 0;color:var(--s500);font-size:12px}
/* volcano */
.memo-item{padding:8px;border-radius:4px;border:1px solid;font-family:ui-monospace,monospace;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.memo-win{background:rgba(2,44,34,.3);border-color:var(--em8);color:#a7f3d0}
.memo-los{background:var(--s900);border-color:var(--s800);color:var(--s400);opacity:.6}
/* ============ TELEMETRY ============ */
.tel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.tel-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.tel-grid{grid-template-columns:repeat(4,1fr)}}
.m-card{padding:8px;border-radius:4px;border:1px solid rgba(30,41,59,.8);background:rgba(2,6,23,.7)}
.m-card.key{border-color:var(--s700);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.m-lab{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--s400);margin-bottom:4px}
.m-lab .u{font-size:10px;color:var(--s500);font-family:ui-monospace,monospace}
.m-row{display:flex;align-items:baseline;justify-content:space-between}
.m-val{font-size:15px;font-weight:700;font-family:ui-monospace,monospace;color:var(--cy3)}
.m-delta{font-size:10px;font-family:ui-monospace,monospace;display:inline-flex;align-items:center}
.m-desc{font-size:9px;color:var(--s500);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-card{padding:10px;border-radius:4px;border:1px solid;font-size:12px;display:flex;align-items:flex-start;gap:8px}
.an-ok{background:rgba(2,44,34,.4);border-color:rgba(6,95,70,.7);color:var(--em3)}
.an-warn{background:rgba(69,26,3,.4);border-color:rgba(146,64,14,.7);color:var(--am3)}
.an-neu{background:var(--s950);border-color:var(--s800);color:var(--s300)}
.an-t{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;display:block}
.an-d{font-size:11px;line-height:1.5;color:var(--s300);opacity:.9}
/* ============ TIMELINE ============ */
.tl-card{padding:12px}
.tl-scrub{position:relative;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
.tl-track{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);height:4px;background:var(--s800);border-radius:2px;z-index:0}
.tl-prog{position:absolute;left:12px;top:50%;transform:translateY(-50%);height:4px;background:var(--cy6);border-radius:2px;z-index:0;transition:width .3s}
.tl-mark{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;outline:none}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:11px;font-weight:700;border:1px solid;transition:all .2s}
.tl-cur .tl-dot{background:var(--cy5);border-color:#fff;color:var(--s950);transform:scale(1.1);box-shadow:0 4px 6px -1px rgba(8,51,68,.9),0 0 0 2px var(--cy4)}
.tl-past .tl-dot{background:var(--s800);border-color:var(--cy8);color:var(--cy3)}
.tl-fut .tl-dot{background:var(--s950);border-color:var(--s800);color:var(--s600)}
.tl-lab{font-size:9px;font-family:ui-monospace,monospace;margin-top:4px;max-width:80px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--s500)}
.tl-cur .tl-lab{color:var(--cy3);font-weight:700}
.log-item{padding:8px;border-radius:4px;border:1px solid;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:ui-monospace,monospace;font-size:12px;margin-bottom:6px}
.log-cur{background:rgba(8,51,68,.6);border-color:var(--cy6);color:#a5f3fc;font-weight:600}
.log-nor{background:rgba(2,6,23,.6);border-color:rgba(30,41,59,.8);color:var(--s400)}
.log-nor:hover{background:rgba(30,41,59,.6)}
.log-l{display:flex;align-items:center;gap:8px;overflow:hidden;min-width:0}
.log-ts{font-size:10px;color:var(--s500);flex-shrink:0}
.log-step{font-size:10px;padding:1px 4px;border-radius:4px;background:var(--s800);color:var(--s300);border:1px solid var(--s700);flex-shrink:0}
.log-tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--s200)}
.log-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.log-ln{font-size:10px;color:var(--in4)}
.log-scroll{max-height:176px;overflow:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
/* ============ INSPECTOR ============ */
.insp{padding:12px}
.depth-sw{display:flex;align-items:center;background:var(--s950);padding:2px;border-radius:4px;border:1px solid var(--s800);font-size:11px}
.dep-btn{padding:2px 8px;border-radius:4px;color:var(--s400);transition:color .15s}
.dep-btn:hover{color:var(--s200)}
.dep-btn.act{background:var(--s800);color:var(--cy3);font-weight:500}
.callout{background:rgba(2,6,23,.8);border:1px solid rgba(30,41,59,.8);padding:10px;border-radius:4px;margin-bottom:12px;font-size:12px;line-height:1.5;color:var(--s300)}
.callout .cl{font-size:10px;font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--cy4);font-weight:600;display:block;margin-bottom:4px}
.insp-grid{display:grid;grid-template-columns:1fr;gap:12px;font-size:12px}
@media(min-width:768px){.insp-grid{grid-template-columns:1fr 1fr}}
.insp-sec{background:rgba(2,6,23,.6);padding:10px;border-radius:4px;border:1px solid rgba(30,41,59,.8)}
.insp-t{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--s300);margin-bottom:4px;font-size:12px}
.insp-p{color:var(--s400);font-size:11px;line-height:1.5}
.insp-p.mono{font-family:ui-monospace,monospace}
/* ============ PARAMETERS ============ */
.pr-card{padding:12px}
.pr-item{background:rgba(2,6,23,.6);padding:8px;border-radius:4px;border:1px solid rgba(30,41,59,.8);margin-bottom:8px}
.pr-lab{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:12px}
.pr-name{font-weight:500;color:var(--s300);display:flex;align-items:center;gap:4px;cursor:pointer}
.pr-val{font-family:ui-monospace,monospace;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--s800);color:var(--cy3);border:1px solid var(--s700);white-space:nowrap}
.pr-range{display:flex;align-items:center;gap:8px}
.pr-min{font-size:10px;color:var(--s500);font-family:ui-monospace,monospace;flex-shrink:0}
input[type=range]{flex:1;accent-color:var(--cy5);height:6px;cursor:pointer;-webkit-appearance:none;appearance:none;background:var(--s800);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cy4);cursor:pointer;border:none}
.sw{position:relative;display:inline-flex;height:20px;width:36px;flex-shrink:0;cursor:pointer;border-radius:999px;border:2px solid transparent;transition:background .2s;outline:none}
.sw.on{background:var(--cy6)}.sw.off{background:var(--s800)}
.sw .knob{pointer-events:none;display:inline-block;height:16px;width:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .2s;transform:translateX(0)}
.sw.on .knob{transform:translateX(16px)}
.sw-note{font-size:11px;color:var(--s400)}
.pr-sel{width:100%;margin-top:4px;background:var(--s900);border:1px solid var(--s700);color:var(--s200);border-radius:4px;padding:4px 8px;font-size:12px;outline:none}
.pr-sel:focus{border-color:var(--cy5)}
.pr-cat{font-size:10px;font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--s500);font-weight:600;margin:12px 0 8px}
.link-btn{color:var(--s400);font-size:11px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.link-btn:hover{color:var(--s200);text-decoration:underline}
/* ============ MODALS ============ */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--s900);border:1px solid var(--s700);border-radius:12px;box-shadow:0 25px 50px -12px rgba(0,0,0,.6);max-width:768px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;color:var(--s200)}
.m-hd{background:var(--s950);padding:12px 16px;border-bottom:1px solid var(--s800);display:flex;align-items:center;justify-content:space-between}
.m-hdt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.m-bd{flex:1;overflow:auto;padding:16px;font-size:12px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.m-ft{background:var(--s950);padding:10px 16px;border-top:1px solid var(--s800);display:flex;justify-content:flex-end}
.sec-box{background:var(--s950);padding:12px;border-radius:8px;border:1px solid var(--s800)}
.sec-lab{font-weight:600;color:var(--cy3);font-family:ui-monospace,monospace;font-size:11px;text-transform:uppercase;display:block;margin-bottom:4px}
.sec-lab.ind{color:var(--in3)}.sec-lab.em{color:var(--em4)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--s300)}
.chain-chip{padding:4px 8px;border-radius:4px;background:var(--s900);border:1px solid var(--s700);font-size:12px}
.chain-chip.hl{background:var(--in95);color:#c7d2fe;border-color:var(--in7);font-weight:600}
.cmp-tbl{width:100%;text-align:left;border-collapse:collapse}
.cmp-tbl thead tr{background:rgba(2,6,23,.8);border-bottom:1px solid var(--s800);font-size:11px;color:var(--s400);font-family:ui-monospace,monospace}
.cmp-tbl th{padding:10px}
.cmp-tbl tbody{font-family:ui-monospace,monospace}
.cmp-tbl tbody tr{border-top:1px solid var(--s800)}
.cmp-tbl tbody tr:hover{background:rgba(2,6,23,.4)}
.cmp-tbl td{padding:10px}
.cmp-m{font-family:-apple-system,sans-serif}
.cmp-m .n{font-weight:500;font-size:12px}
.cmp-m .u{font-size:10px;color:var(--s500)}
.cmp-b{color:var(--s300);text-align:right}
.cmp-c{color:var(--cy3);font-weight:600;text-align:right}
.cmp-v{text-align:right;font-family:ui-monospace,monospace}
.cmp-s{text-align:center}
.pill{padding:2px 6px;border-radius:4px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid}
.pill-unc{background:var(--s800);color:var(--s400);border-color:transparent}
.pill-imp{background:var(--em95);color:var(--em3);border-color:var(--em8)}
.pill-reg{background:var(--am95);color:var(--am3);border-color:#92400e}
.doc-grid{display:grid;grid-template-columns:1fr;gap:8px;font-size:11px}
@media(min-width:640px){.doc-grid{grid-template-columns:1fr 1fr}}
.doc-cell{padding:8px;border-radius:4px;background:var(--s900);border:1px solid var(--s800)}
.doc-cell b{display:block;margin-bottom:2px}
.doc-cell p{color:var(--s400)}
.doc-cell code{color:var(--s300);font-family:ui-monospace,monospace}
.concept-li{display:flex;align-items:flex-start;gap:6px;color:var(--s300);margin-bottom:6px;font-size:12px}
.fid-note{background:rgba(30,27,75,.3);border:1px solid rgba(55,48,163,.6);padding:12px;border-radius:4px;font-size:11px;color:var(--in3)}
.btn-solid{padding:4px 12px;background:var(--cy6);color:var(--s950);font-weight:700;border-radius:4px;font-size:12px}
.btn-solid:hover{background:var(--cy5)}
.btn-dark{padding:4px 12px;background:var(--s800);color:var(--s200);border-radius:4px;font-size:12px}
.btn-dark:hover{background:var(--s700)}
.viz-empty{background:var(--s900);border:1px solid var(--s800);border-radius:4px;padding:24px;text-align:center;color:var(--s400)}
#workstation-root{min-height:100vh;display:flex;flex-direction:column}
</style>

===================================================================== */
function parseSparkQuery(queryText){
  var lines = queryText.split('\n');
  var cleanLines = lines.map(function(l){return l.trim();});
  if(!queryText.trim()){ return {error:'Empty query. Please provide a valid Spark SQL query or DataFrame operation.'}; }
  var selectStart=-1,fromStart=-1,whereStart=-1,groupByStart=-1,havingStart=-1,orderByStart=-1;
  for(var i=0;i<cleanLines.length;i++){
    var line=cleanLines[i].toUpperCase();
    if(line.indexOf('SELECT')===0)selectStart=i+1;
    else if(line.indexOf('FROM')===0)fromStart=i+1;
    else if(line.indexOf('WHERE')===0)whereStart=i+1;
    else if(line.indexOf('GROUP BY')===0)groupByStart=i+1;
    else if(line.indexOf('HAVING')===0)havingStart=i+1;
    else if(line.indexOf('ORDER BY')===0)orderByStart=i+1;
  }
  if(selectStart===-1)return{error:'Syntax Error: Missing SELECT statement in query.'};
  if(fromStart===-1)return{error:'Syntax Error: Missing FROM clause in query.'};
  var fromLineIdx=fromStart-1;
  var fromLineText=lines[fromLineIdx].replace(/--.*$/,'').trim();
  var fromMatch=fromLineText.match(/FROM\s+([a-zA-Z0-9_]+)(?:\s+([a-zA-Z0-9_]+))?/i);
  if(!fromMatch)return{error:'Invalid FROM clause at line '+fromStart+': Expected table identifier'};
  var fromTable={name:fromMatch[1].toLowerCase(),alias:fromMatch[2]?fromMatch[2].toLowerCase():fromMatch[1].toLowerCase(),line:fromStart};
  var joins=[],joinLines=[];
  for(var j=0;j<lines.length;j++){
    var rawLine=lines[j].replace(/--.*$/,'').trim();
    var joinMatch=rawLine.match(/(?:(INNER|LEFT|RIGHT|FULL)\s+)?JOIN\s+([a-zA-Z0-9_]+)(?:\s+([a-zA-Z0-9_]+))?\s+ON\s+(.*)/i);
    if(joinMatch){
      joins.push({type:(joinMatch[1]?joinMatch[1].toUpperCase():'INNER'),table:joinMatch[2].toLowerCase(),alias:joinMatch[3]?joinMatch[3].toLowerCase():joinMatch[2].toLowerCase(),condition:joinMatch[4].trim(),line:j+1});
      joinLines.push(j+1);
    }
  }
  var whereClauses=[];
  if(whereStart!==-1){
    var k=whereStart-1;
    var whereText=lines[k].replace(/--.*$/,'').replace(/WHERE/i,'').trim();
    if(whereText)whereClauses.push({expression:whereText,line:k+1});
    k++;
    while(k<lines.length){
      var l=lines[k].replace(/--.*$/,'').trim();
      if(!l){k++;continue;}
      var upper=l.toUpperCase();
      if(upper.indexOf('GROUP BY')===0||upper.indexOf('ORDER BY')===0||upper.indexOf('HAVING')===0||upper.indexOf('LIMIT')===0)break;
      if(upper.indexOf('AND ')===0||upper.indexOf('OR ')===0){whereClauses.push({expression:l.replace(/^(AND|OR)\s+/i,'').trim(),line:k+1});}
      else if(l.indexOf('=')!==-1){whereClauses.push({expression:l,line:k+1});}
      k++;
    }
  }
  var selectColumns=[];
  var curLine=selectStart;
  while(curLine<=lines.length&&curLine!==fromStart){
    var sl=lines[curLine-1].replace(/--.*$/,'').replace(/SELECT/i,'').trim();
    if(sl){
      var parts=sl.split(',');
      for(var p=0;p<parts.length;p++){
        var trimmed=parts[p].trim();
        if(trimmed){
          var aliasMatch=trimmed.match(/(.+)\s+AS\s+([a-zA-Z0-9_]+)/i);
          if(aliasMatch)selectColumns.push({name:aliasMatch[1].trim(),alias:aliasMatch[2].trim(),line:curLine});
          else selectColumns.push({name:trimmed,line:curLine});
        }
      }
    }
    curLine++;
  }
  return {parsed:{raw:queryText,selectColumns:selectColumns,fromTable:fromTable,joins:joins,whereClauses:whereClauses,groupByColumns:[],havingClauses:[],orderByColumns:[],
    lineMap:{selectLine:selectStart,fromLine:fromStart,whereLine:whereStart!==-1?whereStart:fromStart,joinLines:joinLines,groupByLine:groupByStart!==-1?groupByStart:undefined,orderByLine:orderByStart!==-1?orderByStart:undefined}}};
}
function validateSparkQuery(queryText,validTables){
  var res=parseSparkQuery(queryText);
  if(res.error||!res.parsed)return{isValid:false,issues:[{message:res.error||'Failed to parse query',severity:'error'}]};
  var parsed=res.parsed,issues=[];
  if(validTables.indexOf(parsed.fromTable.name)===-1)
    issues.push({line:parsed.fromTable.line,message:"Table '"+parsed.fromTable.name+"' not found in Spark Catalog. Available tables: "+validTables.join(', '),severity:'error'});
  for(var q=0;q<parsed.joins.length;q++){
    var jj=parsed.joins[q];
    if(validTables.indexOf(jj.table)===-1)
      issues.push({line:jj.line,message:"Joined table '"+jj.table+"' not found in Spark Catalog. Available tables: "+validTables.join(', '),severity:'error'});
    if(!jj.condition)
      issues.push({line:jj.line,message:"Join condition missing for table '"+jj.table+"'. Cross joins require explicit Cartesian product syntax.",severity:'warning'});
  }
  return {isValid:issues.filter(function(i){return i.severity==='error';}).length===0,issues:issues};
}

  }
  var isBroadcast=config.joinType==='BroadcastHashJoin';
  return '/* \n * Apache Spark Whole-Stage Java Code Generation (Janino Compiler)\n * Stage 1 / GeneratedIteratorForCodegenStage1\n * Project Tungsten: Zero virtual dispatch, unrolled CPU pipelining\n */\npackage org.apache.spark.sql.catalyst.expressions;\n\nimport org.apache.spark.sql.execution.BufferedRowIterator;\nimport org.apache.spark.sql.catalyst.InternalRow;\nimport org.apache.spark.sql.catalyst.expressions.codegen.UnsafeRowWriter;\nimport org.apache.spark.sql.execution.joins.LongHashedRelation;\n\npublic final class GeneratedIteratorForCodegenStage1 extends BufferedRowIterator {\n    private scala.collection.Iterator<InternalRow> inputScan;\n    '+(isBroadcast?'private LongHashedRelation broadcastRelation;':'')+'\n    private UnsafeRowWriter rowWriter;\n\n    public GeneratedIteratorForCodegenStage1(Object[] references) {\n        this.inputScan = (scala.collection.Iterator<InternalRow>) references[0];\n        '+(isBroadcast?'this.broadcastRelation = (LongHashedRelation) references[1];':'')+'\n        this.rowWriter = new UnsafeRowWriter(6, 64);\n    }\n\n    @Override\n    protected void processNext() throws java.io.IOException {\n        // Direct unrolled while loop over partition batches (no virtual next() calls)\n        while (inputScan.hasNext()) {\n            InternalRow scanRow = (InternalRow) inputScan.next();\n\n            '+(!config.filterPushedToScan&&config.hasFilter?'// In-Memory Filter evaluation\n            long amount = scanRow.getLong(3);\n            if (!(amount > 25000L)) {\n                continue; // Predicate rejected\n            }':'// [Filter Pushdown Active]: Predicate evaluated in Parquet Vectorized Reader')+'\n\n            '+(isBroadcast?'// Fast Broadcast Hash Table Probe (O(1) memory lookup)\n            long joinKey = scanRow.getLong(1);\n            InternalRow matchedBuildRow = broadcastRelation.getValue(joinKey);\n            if (matchedBuildRow == null) {\n                continue; // Inner join condition failed\n            }':'// Stream side record passed to downstream SortMergeJoin buffer')+'\n\n            // Materialize Tungsten UnsafeRow into off-heap memory buffer\n            rowWriter.reset();\n            rowWriter.write(0, scanRow.getLong(0));   // order_id\n            rowWriter.write(1, scanRow.getLong(1));   // customer_id\n            '+(isBroadcast?'rowWriter.write(2, matchedBuildRow.getUTF8String(1)); // customer_name':'')+'\n            \n            append(rowWriter.getRow());\n            if (shouldStop()) return;\n        }\n    }\n}';
}

 activeTopic:null,activePreset:null,benchmarkCode:'',editCode:'',

===================================================================== */
function selectTopic(topicId){
  var t=getTopicById(topicId);
  S.activeTopic=t;
  var firstPreset=t.presets[0];
  S.activePreset=firstPreset;
  S.benchmarkCode=firstPreset?firstPreset.code:t.defaultCode;
  S.editCode=firstPreset?firstPreset.code:t.defaultCode;
  var initialParams={};
  t.parameters.forEach(function(p){initialParams[p.id]=(firstPreset&&firstPreset.parameters&&firstPreset.parameters[p.id]!=null)?firstPreset.parameters[p.id]:p.defaultValue;});
  S.paramValues=initialParams;
  var plan=t.buildExecutionPlan(firstPreset?firstPreset.code:t.defaultCode,initialParams);
  S.snapshots=plan.steps;S.benchmarkSnapshots=plan.steps;
  S.currentStep=0;S.mode='DEFAULT';S.status='idle';
  S.topicDD=false;S.presetDD=false;S.selectedNode=null;S.catalystTab='tree';
  S.validationResult={isValid:true,issues:[]};
  syncTimer();renderAll();
}
function selectPreset(id){
  var preset=null;
  for(var i=0;i<S.activeTopic.presets.length;i++)if(S.activeTopic.presets[i].id===id)preset=S.activeTopic.presets[i];
  if(!preset)return;
  S.activePreset=preset;S.benchmarkCode=preset.code;S.editCode=preset.code;
  var newParams=Object.assign({},S.paramValues,preset.parameters||{});
  S.paramValues=newParams;
  var plan=S.activeTopic.buildExecutionPlan(preset.code,newParams);
  S.snapshots=plan.steps;S.benchmarkSnapshots=plan.steps;
  S.currentStep=0;S.mode='DEFAULT';S.status='idle';
  S.presetDD=false;S.selectedNode=null;
  S.validationResult={isValid:true,issues:[]};
  syncTimer();renderAll();
}
function onParamInput(id,val){
  var num=Number(val);S.paramValues[id]=isNaN(num)?val:num;
  var b=document.querySelector('[data-badge="'+id+'"]');
  if(b)b.innerHTML=paramBadgeText(id);
  rebuildAfterParamChange();
}
function onParamToggle(id){
  S.paramValues[id]=!S.paramValues[id];
  var b=document.querySelector('[data-badge="'+id+'"]');
  if(b)b.innerHTML=paramBadgeText(id);
  var sw=document.querySelector('[data-sw="'+id+'"]');
  if(sw){sw.className='sw '+(S.paramValues[id]?'on':'off');sw.querySelector('.knob').style.transform=S.paramValues[id]?'translateX(16px)':'translateX(0)';}
  var note=document.querySelector('[data-swnote="'+id+'"]');
  if(note)note.textContent=S.paramValues[id]?'Active in Catalyst planner':'Bypassed in planner';
  rebuildAfterParamChange();
}
function paramBadgeText(id){
  var p=null;for(var i=0;i<S.activeTopic.parameters.length;i++)if(S.activeTopic.parameters[i].id===id)p=S.activeTopic.parameters[i];
  var v=S.paramValues[id]!=null?S.paramValues[id]:(p?p.defaultValue:'');
  if(typeof v==='boolean')return v?'ENABLED':'DISABLED';
  return esc(''+v+(p&&p.unit?' '+p.unit:''));
}
function rebuildAfterParamChange(){
  var currentCode=S.mode==='CUSTOM'?S.editCode:S.benchmarkCode;
  var plan=S.activeTopic.buildExecutionPlan(currentCode,S.paramValues);
  S.snapshots=plan.steps;
  if(S.mode==='DEFAULT')S.benchmarkSnapshots=plan.steps;
  if(S.currentStep>=S.snapshots.length)S.currentStep=0;
  S.selectedNode=null;
  renderDynamic();
}
function resetParams(){
  var initialParams={};
  S.activeTopic.parameters.forEach(function(p){initialParams[p.id]=(S.activePreset&&S.activePreset.parameters&&S.activePreset.parameters[p.id]!=null)?S.activePreset.parameters[p.id]:p.defaultValue;});
  S.paramValues=initialParams;
  var currentCode=S.mode==='CUSTOM'?S.editCode:S.benchmarkCode;
  var plan=S.activeTopic.buildExecutionPlan(currentCode,initialParams);
  S.snapshots=plan.steps;
  S.selectedNode=null;
  renderParams();renderDynamic();
}
function executeCustom(){
  var valResult=S.activeTopic.validate(S.editCode,S.paramValues);
  S.validationResult=valResult;
  if(!valResult.isValid){S.status='error';syncTimer();renderDynamic();return;}
  var plan=S.activeTopic.buildExecutionPlan(S.editCode,S.paramValues);
  S.snapshots=plan.steps;S.mode='CUSTOM';S.currentStep=0;S.status='paused';S.selectedNode=null;
  syncTimer();renderDynamic();
}
function copyToEditSpace(){S.editCode=S.benchmarkCode;renderWorkbench();}
function copyBenchmarkRaw(){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S.benchmarkCode);}
    else{var ta=document.createElement('textarea');ta.value=S.benchmarkCode;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
  }catch(e){}
  S.copiedBenchmark=true;renderWorkbench();
  setTimeout(function(){S.copiedBenchmark=false;renderWorkbench();},2000);
}
function resetToDefault(){
  var code=S.activePreset?S.activePreset.code:S.activeTopic.defaultCode;
  S.editCode=code;S.benchmarkCode=code;
  S.validationResult={isValid:true,issues:[]};
  var initialParams={};
  S.activeTopic.parameters.forEach(function(p){initialParams[p.id]=(S.activePreset&&S.activePreset.parameters&&S.activePreset.parameters[p.id]!=null)?S.activePreset.parameters[p.id]:p.defaultValue;});
  S.paramValues=initialParams;
  var plan=S.activeTopic.buildExecutionPlan(code,initialParams);
  S.snapshots=plan.steps;S.benchmarkSnapshots=plan.steps;
  S.mode='DEFAULT';S.currentStep=0;S.status='idle';S.selectedNode=null;
  syncTimer();renderAll();
}
function nextStep(){
  if(S.currentStep<S.snapshots.length-1){S.currentStep++;}
  else{S.status='completed';syncTimer();}
  renderDynamic();
}
function prevStep(){
  if(S.currentStep>0){if(S.status==='completed')S.status='paused';S.currentStep--;}
  syncTimer();renderDynamic();
}
function resetPlay(){S.currentStep=0;S.status='paused';syncTimer();renderDynamic();}
function handlePlay(){if(S.currentStep>=S.snapshots.length-1)S.currentStep=0;S.status='running';syncTimer();renderDynamic();}
function handlePause(){S.status='paused';syncTimer();renderDynamic();}
function setSpeed(s){S.playbackSpeed=s;syncTimer();renderDeck();}
function toggleParams(){S.isParamsOpen=!S.isParamsOpen;layoutRowA();renderParams();renderDeck();}
function setView(v){S.activeView=v;renderWorkbench();renderHeader();}
function setDepth(d){S.explanationDepth=d;renderInspector();}
function openDocs(){S.isDocsOpen=true;renderModals();}
function closeDocs(){S.isDocsOpen=false;renderModals();}
function openComparison(){S.isComparisonOpen=true;renderModals();}
function closeComparison(){S.isComparisonOpen=false;renderModals();}
function selectStepFromTimeline(s){S.currentStep=s;if(S.status==='completed')S.status='paused';syncTimer();renderDynamic();}
function setTimelineView(v){S.timelineView=v;renderTimeline();}
function setCatalystTab(t){S.catalystTab=t;S.selectedNode=null;renderViz();}
function selectNodeById(id){
  var snap=activeSnapshot();if(!snap||!snap.state||!snap.state.rootNode)return;
  var found=findNode(snap.state.rootNode,id);
  S.selectedNode=found;renderViz();
}
function findNode(node,id){
  if(!node)return null;
  if(node.id===id)return node;
  if(node.children)for(var i=0;i<node.children.length;i++){var f=findNode(node.children[i],id);if(f)return f;}
  return null;
}
function closeDrawer(){S.selectedNode=null;renderViz();}
function toggleTopicDD(){S.topicDD=!S.topicDD;S.presetDD=false;renderHeader();}
function togglePresetDD(){S.presetDD=!S.presetDD;S.topicDD=false;renderHeader();}
function closeDropdowns(){if(S.topicDD||S.presetDD){S.topicDD=false;S.presetDD=false;renderHeader();}}

/* =====================================================================
   PLAYBACK TIMER
===================================================================== */
function syncTimer(){
  if(playTimer){clearInterval(playTimer);playTimer=null;}
  if(S.status==='running'){
    var intervalMs=Math.round(1800/S.playbackSpeed);
    playTimer=setInterval(function(){
      if(S.currentStep<S.snapshots.length-1){S.currentStep++;}
      else{S.status='completed';syncTimer();}
      renderDynamic();
    },intervalMs);
  }
}

function sqlClass(line){
  var t=line.trim().toUpperCase();
  if(t.indexOf('SELECT')===0||t.indexOf('FROM')===0||t.indexOf('WHERE')===0||t.indexOf('JOIN')===0||t.indexOf('ORDER BY')===0||t.indexOf('GROUP BY')===0)return 'k-cyan';
  if(line.indexOf('AND ')!==-1||line.indexOf('OR ')!==-1||line.indexOf('ON ')!==-1)return 'k-indigo';
  return 'k-plain';
}
function renderWorkbench(){
  var snap=activeSnapshot();
  var activeLine=snap?snap.activeLine:undefined;
  var bLines=S.benchmarkCode.split('\n');
  var eLines=S.editCode.split('\n');

    h+='</div></div>';
    h+='<div class="wb-code"><table><tbody>';
    for(var i=0;i<bLines.length;i++){
      var lineNum=i+1,isActive=activeLine===lineNum,isComment=bLines[i].trim().indexOf('--')===0;
      h+='<tr class="'+(isActive?'ln-act':'')+'"><td class="lno">'+lineNum+'</td><td class="ltxt">'+(isActive?'<span class="pdot"></span>':'')+'<span class="'+(isComment?'k-cmt':sqlClass(bLines[i]))+'">'+esc(bLines[i])+'</span></td></tr>';

  }

/* =====================================================================
   RENDER: TELEMETRY MATRIX
===================================================================== */
function getTelemetryAnalysis(values){
  var shuffle=values['shuffleVolumeMB']||0;
  var latency=values['estimatedLatencyMs']||0;
  var scanned=values['scannedRows']||0;
  if(shuffle===0&&latency<400){
    return{status:'optimal',title:'High-Efficiency Broadcast Execution',description:'Zero network shuffle detected. Small table fits inside autoBroadcastJoinThreshold, allowing BroadcastHashJoin with in-memory hash probe and low latency.'};
  }
  if(shuffle>0){
    return{status:'warning',title:'Shuffle Network Saturation Detected',description:'Query triggered SortMergeJoin with '+(values['shuffleExchanges']||2)+' ShuffleExchange stages, redistributing '+shuffle+' MB across cluster network interfaces. Consider increasing broadcast threshold or filtering join inputs.'};
  }
  if(scanned>5000000){
    return{status:'warning',title:'Heavy Disk Scan I/O',description:scanned.toLocaleString()+' rows being scanned. Predicate pushdown may be disabled or column pruning unoptimized.'};
  }
  return{status:'neutral',title:'Normal Pipelined Execution',description:'Catalyst rules have structured the query plan. Pipelined execution stages are preparing distributed partitions.'};
}
function renderTelemetry(){
  var snap=activeSnapshot();
  var prev=previousSnapshot();
  var values=(snap&&snap.metrics)||{};
  var analysis=getTelemetryAnalysis(values);
  var h='<div class="card" id="telemetry-matrix" style="padding:12px">';
  h+='<div class="card-hd"><div class="card-t">'+icon('act','s35')+'<span>Execution Telemetry Matrix</span></div>';
  h+='<span style="font-size:10px;color:var(--s500);font-family:ui-monospace,monospace">STEP '+(S.currentStep+1)+' STATE</span></div>';
  h+='<div class="tel-grid">';
  S.activeTopic.metrics.forEach(function(m){
    var val=values[m.id]!=null?values[m.id]:0;
    var prevVal=prev&&prev.metrics?prev.metrics[m.id]:undefined;
    var diff=prevVal!==undefined?val-prevVal:0;
    h+='<div class="m-card'+(m.isKeyMetric?' key':'')+'">';
    h+='<div class="m-lab"><span title="'+escA(m.label)+'" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.label)+'</span>'+(m.unit?'<span class="u">'+esc(m.unit)+'</span>':'')+'</div>';
    h+='<div class="m-row"><div class="m-val">'+fmt(val)+'</div>';
    if(diff!==0)h+='<div class="m-delta" style="color:'+(diff<0?'var(--em4)':'var(--am4)')+'">'+(diff>0?'+'+diff:diff)+'</div>';
    h+='</div>';
    if(m.description)h+='<div class="m-desc" title="'+escA(m.description)+'">'+esc(m.description)+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="an-card '+(analysis.status==='optimal'?'an-ok':analysis.status==='warning'?'an-warn':'an-neu')+'">';
  h+=analysis.status==='optimal'?icon('check2','s4'):analysis.status==='warning'?icon('atri','s4'):icon('info','s4');
  h+='<div style="flex:1"><span class="an-t">Telemetry Analysis: '+esc(analysis.title)+'</span><p class="an-d">'+esc(analysis.description)+'</p></div></div>';
  h+='</div>';
  document.getElementById('tel-root').innerHTML=h;
}

      h+='<div class="log-item '+(isCurrent?'log-cur':'log-nor')+'" onclick="selectStepFromTimeline('+evt.step+')">';
      h+='<div class="log-l"><span class="log-ts">['+esc(evt.timestamp)+']</span><span class="log-step">STEP '+(evt.step+1)+'</span><span class="log-tx">'+esc(evt.label)+'</span></div>';
      h+='<div class="log-r">'+(evt.sourceLine?'<span class="log-ln">Line '+evt.sourceLine+'</span>':'')+(isCurrent?'<span class="dot ping" style="background:var(--cy4)"></span>':'')+'</div></div>';
    });
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('tl-root').innerHTML=h;
}

/* =====================================================================
   RENDER: DEEP INSPECTOR
===================================================================== */
function renderInspector(){
  var snap=activeSnapshot();
  var explanation=snap?snap.explanation:null;
  if(!explanation){document.getElementById('insp-root').innerHTML='<div class="card" style="padding:16px;text-align:center;color:var(--s500);font-size:12px">Select or advance a step to inspect technical details.</div>';return;}
  var depthText=S.explanationDepth==='beginner'?((explanation.depths&&explanation.depths.beginner)||explanation.whatHappened):S.explanationDepth==='technical'?((explanation.depths&&explanation.depths.technical)||explanation.whyItHappened):((explanation.depths&&explanation.depths.internals)||explanation.underlyingMechanism);
  var h='<div class="card insp" id="deep-inspector">';
  h+='<div class="card-hd" style="margin-bottom:12px"><div class="card-t">'+icon('fsearch','s4')+'<span style="color:var(--s200)">'+esc(explanation.title)+'</span><span class="tag" style="background:var(--in95);border-color:var(--in8);color:var(--in3);font-family:ui-monospace,monospace">'+esc(explanation.phase)+'</span></div>';
  h+='<div class="depth-sw">';
  h+='<button id="depth-beginner" class="dep-btn'+(S.explanationDepth==='beginner'?' act':'')+'" onclick="setDepth(\'beginner\')">Beginner</button>';
  h+='<button id="depth-technical" class="dep-btn'+(S.explanationDepth==='technical'?' act':'')+'" onclick="setDepth(\'technical\')">Technical</button>';
  h+='<button id="depth-internals" class="dep-btn'+(S.explanationDepth==='internals'?' act':'')+'" onclick="setDepth(\'internals\')">Internals</button>';
  h+='</div></div>';
  h+='<div class="callout"><span class="cl">'+S.explanationDepth.toUpperCase()+' PERSPECTIVE</span><p>'+esc(depthText)+'</p></div>';
  h+='<div class="insp-grid">';
  h+='<div class="insp-sec"><div class="insp-t">'+icon('help','s35')+'<span>1. What Happened?</span></div><p class="insp-p">'+esc(explanation.whatHappened)+'</p></div>';
  h+='<div class="insp-sec"><div class="insp-t">'+icon('spark','s35')+'<span>2. Why It Happened?</span></div><p class="insp-p">'+esc(explanation.whyItHappened)+'</p></div>';
  h+='<div class="insp-sec"><div class="insp-t">'+icon('cpu','s35')+'<span>3. Underlying Mechanism</span></div><p class="insp-p mono">'+esc(explanation.underlyingMechanism)+'</p></div>';
  h+='<div class="insp-sec"><div class="insp-t">'+icon('trup','s35')+'<span>4. Performance & Consequences</span></div><p class="insp-p">'+esc(explanation.consequences)+'</p></div>';
  h+='</div></div>';
  document.getElementById('insp-root').innerHTML=h;
}

/* =====================================================================
   RENDER: MODALS
===================================================================== */
function renderModals(){
  /* Comparison */
  var ch='';
  if(S.isComparisonOpen){
    var metrics=S.activeTopic.metrics;
    var lastBench=(S.benchmarkSnapshots&&S.benchmarkSnapshots.length)?S.benchmarkSnapshots[S.benchmarkSnapshots.length-1]:null;
    var lastCust=(S.snapshots&&S.snapshots.length)?S.snapshots[S.snapshots.length-1]:null;
    var benchMetrics=(lastBench&&lastBench.metrics)||{};
    var custMetrics=(lastCust&&lastCust.metrics)||{};
    var benchTitle='Default Benchmark (Canonical)';
    var custTitle=S.mode==='CUSTOM'?'Custom Run':'Current Active Plan';
    ch+='<div class="overlay"><div class="modal">';
    ch+='<div class="m-hd"><div class="m-hdt">'+icon('gitcmp','s4')+'<span>Execution Comparative Analysis</span></div><button class="ico-btn" onclick="closeComparison()">'+icon('x','s4')+'</button></div>';
    ch+='<div class="m-bd">';
    ch+='<div class="sec-box"><span class="sec-lab">Causal Chain of Differences</span>';
    ch+='<div class="chain"><span class="chain-chip">User Configuration / Query Delta</span>'+icon('arr','s35')+'<span class="chain-chip">Catalyst Rule Evaluation</span>'+icon('arr','s35')+'<span class="chain-chip">Physical Join & Exchange Strategy</span>'+icon('arr','s35')+'<span class="chain-chip hl">Telemetry & Runtime Latency</span></div></div>';
    ch+='<div style="border:1px solid var(--s800);border-radius:8px;overflow:hidden;overflow-x:auto"><table class="cmp-tbl"><thead><tr><th>Metric</th><th style="text-align:right">'+esc(benchTitle)+'</th><th style="text-align:right">'+esc(custTitle)+'</th><th style="text-align:right">Variance</th><th style="text-align:center">Status</th></tr></thead><tbody>';
    metrics.forEach(function(m){
      var bVal=benchMetrics[m.id]!=null?benchMetrics[m.id]:0;
      var cVal=custMetrics[m.id]!=null?custMetrics[m.id]:0;
      var diff=cVal-bVal;
      var pct=bVal!==0?Math.round((diff/bVal)*100):(cVal>0?100:0);
      var lowerIsBetter=['estimatedLatencyMs','shuffleVolumeMB','shuffleExchanges','projectedMemoryMB','scannedRows'].indexOf(m.id)!==-1;
      var isImprovement=lowerIsBetter?diff<0:diff>0;
      ch+='<tr><td class="cmp-m"><div class="n">'+esc(m.label)+'</div>'+(m.unit?'<div class="u">'+esc(m.unit)+'</div>':'')+'</td>';
      ch+='<td class="cmp-b">'+fmt(bVal)+'</td>';
      ch+='<td class="cmp-c">'+fmt(cVal)+'</td>';
      ch+='<td class="cmp-v">'+(diff===0?'<span style="color:var(--s500)">0% (Equal)</span>':'<span style="color:'+(isImprovement?'var(--em4)':'var(--am4)')+'">'+(diff>0?'+'+pct+'%':pct+'%')+'</span>')+'</td>';
      ch+='<td class="cmp-s">'+(diff===0?'<span class="pill pill-unc">Unchanged</span>':isImprovement?'<span class="pill pill-imp">'+icon('trdn','s3')+' Improved</span>':'<span class="pill pill-reg">'+icon('trup','s3')+' Regression</span>')+'</td></tr>';
    });
    ch+='</tbody></table></div>';
    ch+='<div class="sec-box" style="font-size:12px;line-height:1.5;color:var(--s300)"><strong style="color:var(--cy3);font-family:ui-monospace,monospace;display:block;margin-bottom:4px">Optimizer Observation:</strong>Comparing the execution profiles reveals how parameter and query alterations shift the underlying execution plan. When data sizes or broadcast thresholds are altered, Catalyst either avoids network shuffles completely (BroadcastHashJoin) or inserts ShuffleExchange partitions (SortMergeJoin).</div>';
    ch+='</div>';
    ch+='<div class="m-ft"><button class="btn-dark" onclick="closeComparison()">Close Comparison</button></div>';
    ch+='</div></div>';
  }
  document.getElementById('cmp-root').innerHTML=ch;
  /* Docs */
  var dh='';
  if(S.isDocsOpen){
    var docs=S.activeTopic.docs;
    dh+='<div class="overlay"><div class="modal">';
    dh+='<div class="m-hd"><div class="m-hdt">'+icon('book','s4')+'<span>Catalyst Architectural Guide: '+esc(S.activeTopic.name)+'</span></div><button class="ico-btn" onclick="closeDocs()">'+icon('x','s4')+'</button></div>';
    dh+='<div class="m-bd">';
    dh+='<div class="sec-box"><span class="sec-lab">1. System Overview</span><p style="color:var(--s300)">'+esc(docs.overview)+'</p></div>';
    dh+='<div class="sec-box"><span class="sec-lab ind">2. The 4 Catalyst Optimization Phases</span><div class="doc-grid" style="margin-top:8px">';
    dh+='<div class="doc-cell"><b style="color:var(--cy3)">Phase 1: Analysis</b><p>Resolves <code>UnresolvedRelation</code> and <code>UnresolvedAttribute</code> nodes using the Spark SessionCatalog, attaching verifiable types and unique Expression IDs.</p></div>';
    dh+='<div class="doc-cell"><b style="color:var(--em3)">Phase 2: Logical Optimization</b><p>Executes rule batches (RBO) via fixed-point iterations. Pushes filter predicates to scans, prunes unused columns, folds static constant math, and propagates nulls.</p></div>';
    dh+='<div class="doc-cell"><b style="color:var(--pu3)">Phase 3: Physical Planning</b><p>Transforms logical relations into executable <code>SparkPlan</code> operators. Evaluates join strategies (BroadcastHashJoin vs SortMergeJoin) and inserts Shuffle Exchanges.</p></div>';
    dh+='<div class="doc-cell"><b style="color:var(--am3)">Phase 4: Whole-Stage Codegen</b><p>Project Tungsten synthesizes unified Java classes and compiles them in-memory using Janino, eliminating virtual method invocations and pipelining rows in CPU registers.</p></div>';
    dh+='</div></div>';
    dh+='<div class="sec-box"><span class="sec-lab">3. Key Engineering Concepts</span><div style="margin-top:6px">';
    docs.importantConcepts.forEach(function(c){dh+='<div class="concept-li">'+icon('check','s35')+'<span>'+esc(c)+'</span></div>';});
    dh+='</div></div>';
    dh+='<div class="sec-box"><span class="sec-lab em">4. Performance Tuning & Best Practices</span><p style="color:var(--s300)">'+esc(docs.performanceImplications)+'</p></div>';
    dh+='<div class="fid-note"><strong style="display:block;margin-bottom:2px;font-family:ui-monospace,monospace;color:#c7d2fe">Simulation Fidelity Notice:</strong>'+esc(docs.simulationNotes)+'</div>';
    dh+='</div>';
    dh+='<div class="m-ft"><button class="btn-solid" onclick="closeDocs()">Got It</button></div>';
    dh+='</div></div>';
  }
  document.getElementById('docs-root').innerHTML=dh;
}

/* =====================================================================
   RENDER ORCHESTRATION
===================================================================== */
function renderAll(){renderHeader();renderDeck();renderWorkbench();layoutRowA();renderParams();renderViz();renderTelemetry();renderTimeline();renderInspector();renderModals();}
function renderDynamic(){renderHeader();renderDeck();renderWorkbench();renderViz();renderTelemetry();renderTimeline();renderInspector();if(S.isComparisonOpen)renderModals();}

/* =====================================================================
   GLOBAL KEYBOARD CONTROLS
===================================================================== */
document.addEventListener('keydown',function(e){
  var tag=document.activeElement?document.activeElement.tagName:'';
  if(tag==='TEXTAREA'||tag==='INPUT'||tag==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();if(S.status==='running')handlePause();else handlePlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();nextStep();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevStep();}
  else if(e.key.toLowerCase()==='r'){e.preventDefault();resetPlay();}
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();executeCustom();}
});
document.addEventListener('click',function(e){
  if((S.topicDD||S.presetDD)&&(!e.target.closest||!e.target.closest('.dd-wrap'))){closeDropdowns();}
});
document.getElementById('ed-ta')&&document.getElementById('ed-ta').addEventListener('input',function(){S.editCode=this.value;});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='ed-ta'){
    S.editCode=e.target.value;
    S._taSel={s:e.target.selectionStart,e:e.target.selectionEnd};
    var g=e.target.parentNode.querySelector('.gutter');
    if(g){var n=e.target.value.split('\n').length;var cur=g.childElementCount;
      if(n!==cur){var html='';for(var i=1;i<=n;i++)html+='<div>'+i+'</div>';g.innerHTML=html;}}
  }
});

/* =====================================================================
   INIT
===================================================================== */
selectTopic(SIMULATION_TOPICS[0].id);
