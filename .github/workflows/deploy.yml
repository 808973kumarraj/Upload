name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false

      - name: Find and Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find React Project
        run: |
          PROJECT=$(find extracted -type f -name package.json -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Install Dependencies
        working-directory: .
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build React Website
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Prepare Website
        run: |
          mkdir -p public
          cp -r "$PROJECT_DIR"/dist/. public/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Website
        uses: actions/deploy-pages@v4
